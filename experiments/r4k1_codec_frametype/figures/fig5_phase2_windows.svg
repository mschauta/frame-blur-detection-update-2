<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Sharpest frame per time window: how often is it an I-frame?">
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; --series-1:#2a78d6; --series-2:#eb6834; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3936; --series-1:#3987e5; --series-2:#d95926; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
.title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.panel { fill: var(--ink); font-size: 13px; font-weight: 600; }
.axis { stroke: var(--ink2); stroke-width: 1; }
.grid { stroke: var(--grid); stroke-width: 1; }
.ref { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<rect width="860" height="360" fill="var(--surface)"/>
<text class="title" x="16" y="26">Sharpest frame per time window: how often is it an I-frame?</text>
<text x="16" y="46">Enrichment of I-frames among the picks over the I-frame share of the windows; 95% intervals (window bootstrap).</text>
<circle cx="21" cy="66" r="5" fill="var(--series-1)"/><text x="31" y="70" style="fill:var(--ink)">round3 (log-sum-exp)</text>
<circle cx="183" cy="66" r="5" fill="var(--series-2)"/><text x="193" y="70" style="fill:var(--ink)">v9 (blur mass)</text>
<text class="panel" x="130" y="100">Video A · 2.6 Mbit/s</text>
<text x="142.8" y="316" text-anchor="middle">1×</text>
<text x="182.5" y="316" text-anchor="middle">2×</text>
<text x="235.0" y="316" text-anchor="middle">5×</text>
<text x="274.8" y="316" text-anchor="middle">10×</text>
<text x="314.5" y="316" text-anchor="middle">20×</text>
<text x="367.0" y="316" text-anchor="middle">50×</text>
<text x="406.8" y="316" text-anchor="middle">100×</text>
