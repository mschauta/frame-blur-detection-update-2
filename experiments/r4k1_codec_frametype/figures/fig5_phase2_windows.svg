<line x1="297.4" x2="303.1" y1="155.0" y2="155.0" stroke="var(--series-2)" stroke-width="2"/><circle cx="300.2" cy="155.0" r="5" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"><title>Video A · 2.6 Mbit/s · 1s · v9 (blur mass): picks are I-frames 19% vs 1% expected → 15.58× (2599 windows)</title></circle>
<text x="16" y="209" style="fill:var(--ink)">5s windows</text>
