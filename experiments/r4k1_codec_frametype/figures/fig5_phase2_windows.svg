<text x="280.0" y="334" text-anchor="middle">I-frame enrichment of the picks (log scale)</text>
<line class="ref" x1="142.8" x2="142.8" y1="110" y2="300"/>
<text x="16" y="149" style="fill:var(--ink)">1s windows</text>
