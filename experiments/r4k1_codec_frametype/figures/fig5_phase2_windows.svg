<line x1="345.4" x2="364.3" y1="275.0" y2="275.0" stroke="var(--series-2)" stroke-width="2"/><circle cx="355.2" cy="275.0" r="5" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"><title>Video A · 2.6 Mbit/s · 20s · v9 (blur mass): picks are I-frames 49% vs 1% expected → 40.70× (131 windows)</title></circle>
