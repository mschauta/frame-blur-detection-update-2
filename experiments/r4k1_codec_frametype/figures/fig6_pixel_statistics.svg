<line x1="697.7" x2="715.4" y1="157.0" y2="157.0" stroke="var(--ink)" stroke-width="2"/><circle cx="707.0" cy="157.0" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>Video B · 5.7 Mbit/s · flat / strong residual · mid-shot I: +2.7% [+1.5, +3.7]; neighbour higher in 64%</title></circle>
<line x1="678.9" x2="683.0" y1="199.0" y2="199.0" stroke="var(--ink)" stroke-width="2"/><circle cx="681.1" cy="199.0" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>Video B · 5.7 Mbit/s · near-zero residual share · mid-shot I: -0.5% [-0.7, -0.2]; neighbour higher in 38%</title></circle>
<line x1="562.3" x2="579.5" y1="241.0" y2="241.0" stroke="var(--ink)" stroke-width="2"/><circle cx="570.5" cy="241.0" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>Video B · 5.7 Mbit/s · 8 px block pattern · mid-shot I: -14.0% [-15.0, -12.9]; neighbour higher in 1%</title></circle>
<line x1="669.0" x2="674.9" y1="283.0" y2="283.0" stroke="var(--ink)" stroke-width="2"/><circle cx="672.1" cy="283.0" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>Video B · 5.7 Mbit/s · strong-cell residual · mid-shot I: -1.6% [-2.0, -1.2]; neighbour higher in 32%</title></circle>
<line x1="673.5" x2="680.9" y1="325.0" y2="325.0" stroke="var(--ink)" stroke-width="2"/><circle cx="676.1" cy="325.0" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"><title>Video B · 5.7 Mbit/s · mean |Laplacian| · mid-shot I: -1.1% [-1.4, -0.5]; neighbour higher in 39%</title></circle>
<circle cx="21" cy="382" r="5" fill="var(--ink)"/><text x="31" y="386">mid-shot I-frame</text><circle cx="161" cy="382" r="5" fill="var(--ink2)"/><text x="171" y="386">shot-start I-frame</text>
